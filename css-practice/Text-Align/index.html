<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Align</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="box1">Box1</div><br>
    <div id="box2">Box2</div> <br>
    <div id="box3">Box3</div><br><hr><hr>
    <!--Text Decoration-->

    <h2 id="box4" class="box">Box4 is the main box</h2>
    <h2 id="box5" class="box">Box5</h2>
    <h2 id="box6" class="box">Box6</h2>
    <h2 id="box7" class="box">Box7</h2>


</body>
</html>
