<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <header>
        <main>
            <form action="/submit.php" method="post">
                <label for="name">Your Name:</label>
                <input type="Text" id="name" name="name" placeholder="Enter your name"><br><br>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Enter your email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
                <label >Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female" > <label for="female">Female</label><br>
                <input type="radio" id="transgender" name="gender" value="transgender"> <label for="transgender">Transgender</label><br><br>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" ><br><br>
                <label for="file">file:</label>
                <input type="file" id="file" name="file" ><br><br>
                <label for="color">color:</label>
                <input type="color" id="color" name="color" ><br><br>
                <label for="range">Range:</label>
                <input type="range" id="range" name="range" min="0" max="100" required><br><br>
                Poke me: <input type="button" value="Poked" ><br><br>

                <label>Language:</label><br>

               <input type="checkbox" name="language" id="Java" value="Java">
               <label for="Java">Java</label><br>

              <input type="checkbox" name="language" id="Python" value="Python">
              <label for="Python">Python</label><br>

              <input type="checkbox" name="language" id="JavaScript" value="JavaScript">
              <label for="JavaScript">JavaScript</label><br><br>

              <label for="fruits">Choose Fruits:</label>
              <select name="fruits" id ="fruits" >
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="orange">Orange</option>
                <option value="grapes">Grapes</option>
              </select><br><br>

                <label for="submit"> Submit:</label>
                <input type="submit" value="Submit"><br><br>
            </form>
        </main>
    </header>
    <hr>
    <footer>

    </footer>
    
</body>
</html>
